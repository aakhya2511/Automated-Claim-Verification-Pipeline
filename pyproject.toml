[project]
name = "automated-claim-verification"
version = "0.1.0"
description = "Hybrid deterministic + LLM pipeline for verifying commercial claims against an authoritative reference dataset."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "build>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"configs/phase7/optimized_final.yaml" = "app/resources/configs/phase7/optimized_final.yaml"
"prompts/rater/v1.txt" = "app/resources/prompts/rater/v1.txt"
"prompts/extractor/v1.txt" = "app/resources/prompts/extractor/v1.txt"
"data/reference/catalog.jsonl" = "app/resources/data/reference/catalog.jsonl"

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "TID",    # tidy imports
    "RUF",    # ruff-specific
    "ASYNC",  # async correctness
    "PL",     # pylint subset
    "TRY",    # exception anti-patterns
    "ANN",    # missing annotations
]
ignore = [
    "ANN401",  # allow typing.Any in narrow adapter boundaries
    "PLR0913", # constructor injection legitimately takes many collaborators
    "TRY003",  # domain exceptions carry contextual messages
    "TRY300",  # `return` in `try` is fine and clearer in places
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "PLR0915"]
"scripts/**" = ["ANN", "PLR2004"]
# In the data generators the numeric literals *are* the data specification
# (sampling probabilities, price bands); naming each one would obscure it.
"app/datagen/**" = ["PLR2004"]
"app/evaluation/**" = ["PLR2004", "PLR0911", "PLR0912"]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 18
max-statements = 60
# Operator dispatch (`match` over comparison operators) and early-return
# resolution chains are clearer as many short returns than as accumulated state.
max-returns = 10

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: benchmarks and full-dataset evaluation regressions",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
